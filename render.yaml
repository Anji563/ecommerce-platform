services:
  # 1. FastAPI Web Service
  - type: web
    name: ecommerce-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString

  # 2. Celery Worker (Configured as Web Service for Free Plan)
  - type: web
    name: ecommerce-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -c "import subprocess, os; subprocess.Popen(['python', '-m', 'http.server', '10000']); os.system('celery -A app.tasks.celery_app worker --loglevel=info')"
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString

  # 3. Redis Instance
  - type: redis
    name: ecommerce-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Database
  - name: ecommerce-db
    databaseName: ecommerce
    user: ecommerce_user
    region: singapore
    plan: free