services:
  # 1. FastAPI Web Service
  - type: web
    name: ecommerce-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString

  # 2. Celery Background Worker
  - type: worker
    name: ecommerce-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString

  # 3. Redis Instance
  - type: redis
    name: ecommerce-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  # 4. PostgreSQL Database
  - name: ecommerce-db
    databaseName: ecommerce
    user: ecommerce_user
    region: singapore
    plan: free